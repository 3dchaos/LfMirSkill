<TITLE>获取NPC坐标</TITLE>
</HEAD>
<BODY>
<P><FONT size=2><FONT 
color=#0000ff><STRONG>功能：</STRONG></FONT><BR>
&nbsp;&nbsp;&nbsp; <FONT 
size=2>检测地图中的NPC并得到坐标</FONT></FONT></P><BR><BR>

<P><FONT size=2><FONT color=#0000ff><STRONG>命令：</STRONG></FONT><BR>
FindNpcPoint 地图名  NPC名称  X坐标变量  Y坐标变量<BR><BR>

<P><FONT size=2><FONT color=#0000ff><STRONG>说明：</STRONG></FONT><BR>
如果同一地图拥有相同名称的NPC，只会获取第一个找到的NPC，支持自定义NPC获取<BR><BR><BR>



[@测试]<BR>
#if<BR>
FindNpcPoint 3 盟重老兵 N1 N2<BR>
#act<BR>
SendMsg 6 盟重省中npc盟重老兵的坐标为&lt;$STR(N1)&gt;,&lt;$STR(N2)&gt;<BR><BR><BR>











</BODY>
</HTML>
