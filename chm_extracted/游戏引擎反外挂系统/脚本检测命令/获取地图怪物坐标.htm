<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0//EN">
<HTML>
<HEAD>
<meta http-equiv="Content-Language" content="zh-cn">

<TITLE>获取地图怪物坐标</TITLE>
</HEAD>
<BODY>
<P><FONT size=2><FONT 
color=#0000ff><STRONG>功能：</STRONG></FONT><BR>
&nbsp;&nbsp;&nbsp; <FONT 
size=2>检测地图中的最近的怪物并得到坐标</FONT></FONT></P><BR><BR>

<P><FONT size=2><FONT color=#0000ff><STRONG>命令：</STRONG></FONT><BR>
FindMonPoint 地图名  怪物名称  X坐标变量  Y坐标变量<BR><BR>

<P><FONT size=2><FONT color=#0000ff><STRONG>说明：</STRONG></FONT><BR>
如果同一地图拥有相同名称的怪物，只会检测地图中的最近的怪物并得到坐标<BR><BR><BR>


[@测试]<BR>
#if<BR>
FindMonPoint 3 采集怪 N1 N2<BR>
#act<BR>
SendMsg 6 最近的盟重采集怪坐标为&lt;$STR(N1)&gt;,&lt;$STR(N2)&gt;<BR>

<BR><BR><BR>











</BODY>
</HTML>
