<p> 使用方法:\Envir\UserData\PoisonWeapon.txt</p>
<p> 格式: 武器名称 成功几率 减HP值 基本时间 扩展时间<br />
  成功率100以下时设置多少就是多少的成功率例如:80就是80%的成功率50就是50%的成功率<br />
  扩展时间是一个随即值,假如设置为10那么它的值就是1-10之间的值. 持续时间=基本时间+扩展时间所产生的随机值<br />
  例如:木剑 90 10 10 5</p>
