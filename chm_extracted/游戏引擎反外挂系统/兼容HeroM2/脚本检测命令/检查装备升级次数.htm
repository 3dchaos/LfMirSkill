<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>检查装备升级次数</title>
<meta name="GENERATOR" content="WinCHM">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">

</head>

<BODY>
<P><FONT face=Fixedsys size=2>功能: 用来检测通过宝石升级装备的次数.<BR>格式: CheckItemupgradeCount 
方式(0,1) 位置(0-12) 操作符(&gt; = &lt;) 次数(0-255) <BR>说明: 
方式=0时检测正在升级的装备,方式=1时检测人物身上的装备.<BR></FONT></P>
<P><FONT face=Fixedsys size=2><BR>例子: 
检测武器是否已经升级10次.<BR>#IF<BR>CheckItemUpgradeCount 1&nbsp;1 &gt; 
10<BR>#SAY<BR>你的武器已经升级了10次以上.</FONT></P></BODY>
</html>
