<P><FONT face=Fixedsys size=2>功能:检查人物杀死怪物的名字 <BR>格式:CheckKillMonName 名字 
是否清除(0,1)<BR>说明:是否清除参数可以不需要默认0,为了避免杀死某个怪物可重复执行脚本是设置1.<BR><BR></FONT><FONT 
face=Arial size=2><FONT face=Fixedsys><BR>[@main]<BR>#IF<BR>CheckKillMonName 
白野猪<BR>#SAY<BR>你把白野猪干掉了!<BR><BR><BR>;检测后立即清除人物内置变量.<BR></FONT></FONT></P>
<P><FONT face=Arial size=2><FONT 
face=Fixedsys>[@main]<BR>#IF<BR>CheckKillMonName 白野猪 1<BR>#SAY<BR>你把白野猪干掉了!</P>
