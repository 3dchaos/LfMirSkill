<title>给予带绑定状态装备[!]</title>
<meta name="GENERATOR" content="WinCHM">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">

</head>

<BODY>
<P>功能：<br>
给予带绑定状态装备。主要方便设置不能配带的装备绑定状态</P>
<p>格式：</p>
<p>格式:GiveStateItem 装备位置(-1~13,-1时为OK框中物品)<br>
  GiveStateItem 物品名称 项目1 项目2 项目3 项目4 项目5 项目6(0为正常,1为绑定)</p>
<p>;项目1--禁止扔，项目2--禁止交易，项目3--禁止存，项目4--禁止修，项目5--禁止出售,项目6--禁止爆出的装备 项目7--丢弃消失</p>
<p>[@给一个绑定的装备]<br>
  #ACT<br>
  GiveStateItem 木剑 1 0 0 0 0 0<br>
  SENDMSG 6 给你一个绑定木剑并且禁止扔 </p>
<P><BR>
  <FONT 
face=Fixedsys><BR>
  </FONT></P>
</BODY>
</html>
