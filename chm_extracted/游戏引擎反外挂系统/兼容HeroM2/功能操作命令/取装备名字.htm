<head>
<title>取装备名字</title>
<meta name="GENERATOR" content="WinCHM">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">

</head>

<BODY>
<P><FONT face=Arial size=2><FONT face=Fixedsys>取指定位置的装备名字<BR>格式: GetUserItemName 
位置(0-12) S变量(0-99)  参数3是否只取DB中的名称(0:若改名以改名为准； 1：只取DB中的名称）<BR>说明: S变量是人物私有变量(0-99) 参数3是否只取DB中的名称(0:若改名以改名为准； 1：只取DB中的名称）<BR><BR>例子: 
把武器的名字放如S10变量中</FONT></FONT></P>
<P><FONT face=Fixedsys size=2>#IF<BR>#ACT<BR>GetUserItemName 1 10<BR>SendMsg 5 
武器的名字: &lt;$STR(S10)&gt;</FONT></P></BODY>
</html>
