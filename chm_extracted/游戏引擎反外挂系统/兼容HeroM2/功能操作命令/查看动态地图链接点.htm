<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>查看动态地图链接点</title>
<meta name="GENERATOR" content="WinCHM">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">

</head>

<BODY>
<P><FONT face=Arial size=2><FONT face=Fixedsys>说明: 
查看使用AddMapRoute设置的动态链接点.<BR>格式: GetMapRouteInfo 链接标示&nbsp;查看方式(0-1) 坐标X 
坐标Y</FONT></FONT></P>
<P><FONT face=Fixedsys size=2>例子: 
查看地图链接点<BR>[@ViewRoute]<BR>#IF<BR>#ACT<BR>;查看链接坐标,<FONT 
color=#ff0000>参数2等于0查看连接地图,等于1查看待连接地图.</FONT><BR>GetMapRouteInfo 1 0 A0 G0 
G1<BR>GetMapRouteInfo 1 1 A1 G2 G3<BR>SendMsg 5 
[地图&lt;$STR(A0)&gt;坐标:&lt;$STR(G0)&gt;:&lt;$STR(G1)&gt;]-&gt;[地图&lt;$STR(A1)&gt;坐标:&lt;$STR(G2)&gt;:&lt;$STR(G3)&gt;]</FONT></P></BODY>
</html>
