<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>读取文本内容到变量[!]</title>
<meta name="GENERATOR" content="WinCHM">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">

</head>

<BODY>
<P>功能: 读取文本文件中的内容到变量中.</P>
<p>格式:GetListString 文件路径 行号(行号从0开始) 变量1 变量2  是否绝对路径(0,1)<br>
  说明: 变量2可以不需要,当读取变量2时文本单行的内容必须是以下格式:<br>
  人物1:10<br>
  人物2:20<br>
</p>
<p>例子:<br>
  [@main]<br>
  #IF<br>
  #ACT<br>
  GetListString ..\QuestDiary\测试.txt 5 A10 N10</p>
</BODY>
</html>
