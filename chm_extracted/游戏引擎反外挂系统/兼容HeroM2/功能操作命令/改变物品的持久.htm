<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>改变物品的持久</title>
<meta name="GENERATOR" content="WinCHM">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">

</head>

<BODY>
<P><FONT size=2><FONT face=Fixedsys><FONT color=#ff0000>功能:</FONT> 
修改指定位置装备的当前持久和最大持久.<BR>
<FONT color=#0000ff>格式:</FONT>  ChangeItemDura 装备位置(0-12)   操作符(+,-,=)   持久(0-65000)   是否修改最大持久 (0或空为当前持久。1为修改最大持久)<BR></FONT></FONT></P>
<P>


#IF<BR>
#ACT<BR>
ChangeItemDura 0 - 1000<BR>
#SAY<BR>
你的物品当前持久降低1点.<BR><BR><BR>


#IF<BR>
#ACT<BR>
ChangeItemDura 0 + 1000 1<BR>
#SAY<BR>
你的物品最大持久增加1点.<BR><BR><BR>



</FONT></P></FONT></BODY>
</html>
