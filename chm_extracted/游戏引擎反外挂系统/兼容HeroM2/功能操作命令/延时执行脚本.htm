<BODY>
<P><FONT face=Fixedsys size=2>延时执行指定的脚本. </FONT></P>
<P><FONT face=Fixedsys size=2>DelayCall S Label (S单位毫秒, 
Label是需要跳转的脚本段)<BR></FONT></P>
<P><FONT face=Fixedsys size=2>#IF<BR>#ACT<BR>DelayCall 5000 @Kick</FONT></P>
<P><FONT face=Fixedsys size=2></FONT>&nbsp;</P>
<P><FONT face=Fixedsys 
size=2>[@Kick]<BR>#IF<BR>#ACT<BR>Kick</FONT></P></BODY>
