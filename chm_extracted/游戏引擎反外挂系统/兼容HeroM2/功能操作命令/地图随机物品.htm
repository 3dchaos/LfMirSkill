<BODY><FONT face=Arial>
<P><FONT color=#ff0000><FONT size=2><FONT face=Fixedsys>使用方法: </FONT><FONT 
color=#000000><FONT face=Fixedsys>Envri\UserData\MapItems.txt <BR><FONT 
color=#0000ff>使用说明: </FONT></FONT></FONT><FONT face=Fixedsys 
color=#000000>添加的物品可自动出现在指定地图的指定范围内.<BR></FONT></FONT></FONT></P>
<P><FONT face=Fixedsys size=2></FONT>&nbsp;</P>
<P><FONT face=Fixedsys size=2>添加格式: 物品名称 出现地图 坐标X:坐标Y 几率:范围:时间:数量<BR>几率说明: 
物品几率大于100时设置多少就是多少分之一的出现率,例如1000就是1/1000的可能.100以内设置每减一几率降低一点.例如80就是80%的可能,50就是50%的可能.</FONT></P>
<P><FONT face=宋体 size=2><FONT face=Fixedsys>例如: 
在盟重省330:330范围10以内每过2分钟有50%的可能出现5个传送戒指<BR>传送戒指 3 330:330 
50:10:2:5</FONT>&nbsp;</FONT></P></FONT></BODY>
