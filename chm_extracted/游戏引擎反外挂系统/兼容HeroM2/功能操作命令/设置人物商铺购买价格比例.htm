<BODY><FONT face=Arial size=2><FONT face=Fixedsys>功能: 设置人物商铺购买物品的价格比例.<BR>格式: 
SetShopItemPriceRate 比例(1-100)<BR>注意: 人物下线后状态消失.<BR>其他: 
列表信息中可设置单个物品是否允许打折购买.<BR><BR>例如:大于100级人物商铺购买物品的价格比例是90%,人物上线时在登录脚本设置价格比例即可.<BR><BR>[@Login]<BR>#IF<BR>CheckLevelEx 
&gt; 99<BR>#ACT<BR>SetShopItemPriceRate 90</FONT></FONT></BODY>
