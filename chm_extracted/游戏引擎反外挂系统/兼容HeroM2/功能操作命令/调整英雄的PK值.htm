<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>调整英雄的PK值[!]</title>
<meta name="GENERATOR" content="WinCHM">
<meta http-equiv="Content-Type" content="text/html; charset=gb2312">

</head>

<body>
<P><FONT face=Fixedsys size=2>增加英雄PK值 </FONT></P>
<P><FONT face=Fixedsys size=2>#IF<BR>CheckHeroOnline<BR>#ACT<BR>ChangeHeroPkPoint + 
100<BR>#SAY<BR>  
你英雄的PK值增加100点.</P>


<P><FONT face=Fixedsys size=2>减少英雄PK值 </FONT></P>
<P><FONT face=Fixedsys size=2>#IF<BR>CheckHeroOnline<BR>#ACT<BR>ChangeHeroPkPoint - 
100<BR>#SAY<BR>  
你英雄的PK值减少100点.</P>


<P><FONT face=Fixedsys size=2>调整英雄PK值 </FONT></P>
<P><FONT face=Fixedsys size=2>#IF<BR>CheckHeroOnline<BR>#ACT<BR>ChangeHeroPkPoint = 
100<BR>#SAY<BR>  
你英雄的PK值等于0点.</P></P></P>

;英雄PK值脚本变量查看：英雄当前PK值：&lt;$HEROPKPOINT&gt;

</FONT></P></body>
</html>
