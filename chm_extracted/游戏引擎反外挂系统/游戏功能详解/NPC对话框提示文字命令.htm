<title>NPC对话框提示文字命令，NPC界面上向上滚动提示信息</title>
</head>

<body>

<br><br><br>

功能说明：NPC界面上向上滚动提示信息<br><br>

格式：SENDMOVEHINTMSG  文字信息  文字颜色 背景颜色  X坐标 Y坐标  停留时间(秒；0或空默认3秒)<br><br>



文字换行：\<br><br><br><br>






[@5555]<br>
#IF<br>
checkgold 2500000<br>
#ACT<br>
#ELSEACT<br>
SENDMOVEHINTMSG 金币不足\金币不足 249 0 10 60<br><br><br><br>


[@55555]<br>
#IF<br>
checkgold 2500000<br>
#ACT<br>
#ELSEACT<br>
;停留5秒消失<br>
SENDMOVEHINTMSG 金币不足\金币不足 249 0 10 60 5<br><br><br><br>


<p>&nbsp;</p>
<p>&nbsp;</p>
</body>
</html>
