<TITLE>清除地图中的怪物</TITLE>
</HEAD>
<BODY>
<P><FONT size=2><STRONG><FONT 
color=#0000ff>功能：</FONT><BR>&nbsp;&nbsp;&nbsp;</STRONG>用于清除指定地图里的怪物，人物的宝宝不在此范围以内，禁止清除怪物列表中的怪物不会被清除。<BR>&nbsp;&nbsp;&nbsp; 
此功能一般用于动态刷怪方式，在有人的地图出现怪物，没人时地图上的怪物全部清除，以大大节约机器资源。<BR><BR><STRONG><FONT 
color=#0000ff>命令格式：</FONT></STRONG><BR>CLEARMAPMON 
地图号<BR><BR></FONT><STRONG><FONT color=#0000ff>例子：</FONT><FONT color=#000000><BR>
  </FONT></STRONG><BR>
  <FONT size=2>#ACT<BR>
  CLEARMAPMON&nbsp; 
  D717<BR>
  #say<BR>
&lt;返回/@main&gt;<BR>
  <BR>
  </FONT>
</BODY>
</HTML>
