<P><STRONG><FONT size=5>强行捡起他人打怪爆出未到冷却时间的物品，捡起地面他人打怪爆出(一定时间范围内不能捡起)的物品</FONT></STRONG></P>
<P><font size="2"><span class="STYLE2"><strong>功能：</strong>强行捡起地面他人打怪爆出(一定时间范围内不能捡起)的物品</span><br><br><br>
      <strong>命令：</strong><br><br>


一般用于自定义技能触发执行脚本，执行脚本后捡起自己脚下物品<br><br>

命令：ForcePickItem <br><br>





;-------------------------------<strong>Npc示范脚本：</strong>----------------------------<br><br>


[@MagSelfFuncX]<br>
#if<br>
#ACT<br>
ForcePickItem<br>
SENDMSG 6 物品已捡起<br>
break<br><br><br><br><br><br>
