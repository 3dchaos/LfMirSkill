<TITLE>设置被怪物攻击时伤害吸收</TITLE>
</HEAD>
<BODY>
<P><FONT size=2><FONT 
color=#0000ff><STRONG>功能：</STRONG></FONT><BR>&nbsp;&nbsp;&nbsp; 
设置被怪物攻击时伤害吸收(宝宝/宠物除外)<BR><FONT 


<FONT 
color=#000000></FONT></P></FONT>
<P><FONT size=2><STRONG><FONT 
color=#0000ff>格式：</FONT><BR></STRONG>&nbsp;&nbsp;&nbsp; &nbsp; 
StruckDamageAbsorb 怪物名(*表示所有怪) 吸收几率(1~100)  伤害吸收比例(1~100) 有效时间（秒）<BR></FONT>

</br></br></br>
[@伤害吸收]</br>
#if</br>
#act</br>
StruckDamageAbsorb 白野猪 50 80 30</br>
sendmsg 5 50%几率吸收白野猪80%的伤害，有效时间30秒</br></br></br>

英雄操作命令：H.StruckDamageAbsorb</br>





</FONT><FONT 
size=2>。<BR>;==========================================</FONT></P>
