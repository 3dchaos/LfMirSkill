<BODY>
<p>自动穿装备和取装备.新人出生就无需手动穿装备了.<BR>
  <BR>
例子:</p>
<p><BR>
  ;自动穿装备<BR>
AutoTakeOnItem 装备名称 位置(0-12)</p>
<p>;自动脱装备<BR>
  AutoTakeOffItem 装备名称 位置(0-12)如不能正常脱请删除装备名字，只需位置即可 </p>
<p>  物品位置: <BR>
  0 盔甲 <BR>
  1 武器 <BR>
  2 照明物 <BR>
  3 项链 <BR>
  4 头盔 <BR>
  5 右手镯 <BR>
  6 左手镯 <BR>
  7 右戒指 <BR>
  8 右戒指 <BR>
  9 护身符 <BR>
  10 腰带 <BR>
  11 鞋子 <BR>
  12 宝石 <BR>
</p>
</BODY></HTML>
