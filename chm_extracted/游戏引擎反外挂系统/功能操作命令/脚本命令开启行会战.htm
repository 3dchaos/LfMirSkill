<p><strong><font size="5">使用脚本命令开启行会战命令</font></strong> </p>
<font size="2"><span class="STYLE2"><strong>功能：</strong>使用脚本命令开启行会战命令</span><br />
<strong>格式：</strong>如需掌门人才可以用的话请加入检测脚本命令<br />
<strong>说明：</strong>GuildWar 参数1(目标行会名字)    任何有行会的玩家都可以使用(无行会则无效)<br /><br /><br />


<p><font face="楷体" color="#ff0000" size="5"><strong>*例子：</strong></font></p><br />
[@main]<br />
#IF<br />
ISGUILDMASTER<br />
#ACT<br />
GuildWar 测试测试<br />
#ELSESAY<br />
只有行会掌门人才可以申请行会战！！！<br /><br /><br /><br />
