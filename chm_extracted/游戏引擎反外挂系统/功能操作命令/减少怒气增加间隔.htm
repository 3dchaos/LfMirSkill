<P><FONT size=2><FONT 
color=#0000ff><STRONG>功能：</STRONG></FONT><BR>
&nbsp;&nbsp;&nbsp; <FONT 
size=2>减少合击怒气恢复间隔</FONT></FONT></P><BR><BR><BR>


;减少怒气增加间隔   减少值    命令有效时间(单位：秒;  0为一直有效)<BR><BR>
DecAddAngryValueTime 100 0<BR><BR><BR>




[@测试]<BR>
#IF<BR>
#ACT<BR>
DecAddAngryValueTime 100 0<BR>
SENDMSG 7 怒气恢复间隔减少100毫秒，有效时间：持续有效<BR>
BREAK<BR>
<BR>


[@测试]<BR>
#IF<BR>
#ACT<BR>
DecAddAngryValueTime 500 200<BR>
SENDMSG 7 怒气恢复间隔减少500毫秒，有效时间：200秒<BR>
BREAK<BR>
<BR>
<BR><BR><BR>
