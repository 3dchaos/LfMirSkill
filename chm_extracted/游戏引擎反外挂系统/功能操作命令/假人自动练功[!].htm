<BODY>
<P><FONT face=Arial size=2><FONT face=Fixedsys>功能: 假人自动练功</FONT></FONT></P>
<P>格式:AutoUseMagic 技能名字 间隔秒。(必须是学过的技能，在非挂机状态，没有攻击目标的情况下才能正常练功)</P>
<P>[@main]<BR>
  #ACT<BR>
  AutoUseMagic 雷电术 10 <BR>
</P>
<BR><BR>
停止自动练功<BR>
<P>[@main]<BR>
  #ACT<BR>
StopAutoUseMagic<BR>

<P><BR>
</P>
<P></P>
