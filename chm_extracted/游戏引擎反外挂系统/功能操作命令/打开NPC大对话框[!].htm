<title>打开NPC大对话框[!]</title>
</head>

<body>


功能说明：打开NPC大对话框<br><br>
<p>格式: OPENMERCHANTBIGDLG WIL文件序号 图片序号 是否可以移动(0,1) 显示位置(0=左上角,1=右上角,2=左下角,3=右下角,4=居中) 微调坐标X  微调坐标Y 是否显示关闭按钮(0,1) 关闭按钮坐标X 关闭按钮坐标Y  是否当前NPC对话一直使用此对话框(0和空为不延续，1则延续)<br>
</p>
<p>[@main]<br />
  #ACT<br />
  OPENMERCHANTBIGDLG 0 0 <br>
</p>
</body>
</html>
