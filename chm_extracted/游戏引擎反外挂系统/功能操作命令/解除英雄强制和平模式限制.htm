<TITLE>解除英雄强制和平模式限制</TITLE>
</HEAD>
<BODY>
<P><FONT size=2><FONT 
color=#0000ff><STRONG>功能：</STRONG></FONT><BR>
&nbsp;&nbsp;&nbsp; <FONT 
size=2>解除英雄强制和平模式限制</FONT></FONT></P><BR><BR><BR>


;当引擎设置英雄强制和平模式时候，可以用此命令进行解除<BR><BR>
CancelHeroForcePeaceMode 命令有效时间(单位：秒;  0为一直有效)<BR><BR><BR>




[@测试]<BR>
#IF<BR>
#ACT<BR>
CancelHeroForcePeaceMode  0<BR>
SENDMSG 7 你的英雄已经解除和平模式限制<BR>
BREAK<BR>
<BR>


[@测试]<BR>
#IF<BR>
#ACT<BR>
CancelHeroForcePeaceMode 600 <BR>
SENDMSG 7 你的英雄已经解除和平模式限制，有效时间：600秒<BR>
BREAK<BR>
<BR>
<BR><BR><BR>

</BODY>
</HTML>
