<p><strong><font size="5">修理沙巴克城墙城门</font></strong> </p>
<font size="2"><span class="STYLE2"><strong>功能：</strong>可在任何时间对沙巴克城门和城墙进行修理</span><br />


-----------------------------------------------------------------</br></br>

NPC命令：</br>
修理城门：RepairDoor</br>


修理城墙：RepairWall 参数1    (参数1、2、3分别对应3个城墙)</br></br>



<p><font face="楷体" color="#ff0000" size="5"><strong>*例子</strong></font></p>



[@修复城墙]</br>
#IF</br>
#ACT</br>
RepairDoor</br>
RepairWall 1</br>
RepairWall 2</br>
RepairWall 3</br>
SendMsg 6 沙巴克城墙和城门已全部修复.</br>
</br>




</body>
