&nbsp;&nbsp;&nbsp; <FONT

<P><FONT size=2><FONT color=#0000ff><STRONG>格式：</STRONG></FONT><BR>
CheckAngryValue 操作符(&gt;,&lt;,=) 值  值类型(0:点数；1:百分比)<BR><BR><BR>




[@测试]<BR>
#IF<BR>
CheckAngryValue &gt; 80 1<BR>
#act<BR>
sendmsg 6 你的英雄怒气值&gt;80%<BR>

<BR>

英雄怒气值变量：&lt;$H.AngryValue&gt;
