<TITLE>调整合击怒气值</TITLE>
</HEAD>
<BODY>
<P><FONT size=2><FONT 
color=#0000ff><STRONG>功能：</STRONG></FONT><BR>
&nbsp;&nbsp;&nbsp; <FONT 
size=2>调整合击怒气值</FONT></FONT></P><BR><BR><BR>


SetAngryValue 操作符(+/-/=)   值   是否为百分比值(0:点数；1：百分比)<BR><BR><BR>




[@测试]<BR>
#IF<BR>
#ACT<BR>
SetAngryValue + 5 0<BR>
SendMsg 6 你的英雄怒气增加了5个点<BR><BR>

**本命令对可对人物 或英雄使用，如果是对人物使用，自动调整人物英雄的值,本命令不用特别指定 H.<BR>
<BR><BR><BR>


[@测试]<BR>
#IF<BR>
#ACT<BR>
SetAngryValue + 5 1<BR>
SendMsg 6 你的英雄怒气增加了5%<BR><BR>

**本命令对可对人物 或英雄使用，如果是对人物使用，自动调整人物英雄的值<BR>
<BR>

</BODY>
