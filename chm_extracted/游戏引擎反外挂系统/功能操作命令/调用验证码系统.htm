<p></br></br></br></br></br></br></br>
验证码功能，用法类似GOTO，验证成功后需下级脚本才有执行权限(验证码支持中文、字母、数字自行在<B>M2-列表信息1</B>设置验证内容)</br>
例:</br>
[@main]</br>
#IF</br>
CanVerifyCode</br>
#ACT</br>
VerifyCode @回收验证完成</br></br>

[@回收验证完成]</br>
#IF</br>
CheckVerifyCode</br>
#ACT</br>
#say</br>
验证通过!</br></br></br>


</body>
