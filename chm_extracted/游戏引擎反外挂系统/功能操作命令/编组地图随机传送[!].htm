<P>编组地图随机传送<BR><BR>
<FONT face=宋体>GROUPMOVE 地图号 可以传送最低等级(可以为空，为空时不检测队员的等级直接传送) 触发字段(可以为空)  范围（以队长为中心设置范围，只传送范围内的队友，留空或者0为不需要范围，大于0则按照范围传送）<BR><BR></FONT>[@main]<BR>
#IF<BR>
#ACT<BR>
GROUPMOVE 3 @GROUPMOVE</P>

<p>[@GROUPMOVE]<BR>
  #IF<BR>
  #ACT<BR>
  SENDMSG 6 组队传送</p>
