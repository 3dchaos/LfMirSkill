<p><font color="#0000FF"><b>二级密码功能</b></font></p>
<font face="Arial" size="2"> </br> </br> </br> </br> </br>


LoginSrv 启用二级密码 </br> </br>

路径：mirserver\LoginSrv\Logsrv.ini  </br>
查找： </br>
EnabledL2Password=0 </br> </br>

修改为： </br>
EnabledL2Password=20161105 </br> </br>

然后重启LoginSrv.exe，打开基本设置即可看到二级密码相关设置！ </br> </br> </br> </br> </br>


本功能20170419开始已经无需设置参数，默认开启！</br> </br> </br> </br> </br>
