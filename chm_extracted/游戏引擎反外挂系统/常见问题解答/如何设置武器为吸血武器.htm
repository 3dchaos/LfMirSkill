<P><FONT size=2>功能：<BR>&nbsp;&nbsp;&nbsp; 可将武器设置成吸血武器；</FONT></P>
<P><FONT 
size=2>用法：<BR>&nbsp;&nbsp;&nbsp; 在物品数据库中，将武器Anicount字段设为：138，<BR>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;吸血量为武器的重量（如重量为10，即每刀吸血10点）<BR></FONT></P>
