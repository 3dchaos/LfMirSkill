<TITLE>登陆游戏黑屏</TITLE>
</HEAD>
<BODY>
<P>登陆游戏黑屏</P>
<P>1.有可能是开的游戏网关(RunGate)有相同的端口。</P>
<P>&nbsp;解决方法：在控制器-&gt;配置向导-&gt;网关设置中调整设置</P>
<P>2.有可能是由于开了防火墙或者安全策略把你游戏网关(RunGate)端口给屏蔽了</P>
<P>解决方法：开放所要用到的端口</P>
<P>3.使用的登陆器和引擎不配套导致黑屏</P>

</BODY>
