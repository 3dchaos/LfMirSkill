<TITLE>如何改变蜡烛类型装备掉持久类型</TITLE>
</HEAD>
<BODY>
<P><FONT size=2>功能：<BR>　　自定义蜡烛物品掉持久控制，支持按时间掉持久或与普通装备一样受攻击掉持久。</FONT></P>
<P><FONT 
size=2>用法：<BR>　　按时间掉持久：数品数据库中Source字段为：０<BR>　　受攻击掉持久：物品数据库中Source字段为：１</FONT></P>
<P>修改蜡烛、火把的持久值为亮度，10000持久亮度为1最高亮度5，会根据持久的降低,降低亮度</P>
