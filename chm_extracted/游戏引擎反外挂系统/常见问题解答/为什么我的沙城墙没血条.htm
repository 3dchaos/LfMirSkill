</HEAD>
<BODY>
<P>第一步.首先检查M2启动有没报错，如有检查怪物数据库(Monster.DB)有没设置城墙类型怪物名称，如没只需将城墙名称与怪物数据库相对应即可解决，错误信息如下：<BR>&nbsp;&nbsp;&nbsp; 
[错误信息] 城堡初始化城门失败，检查怪物数据库里有没城门的设置: MainDoor，</P>
<P>第二步.检查怪物数据库内城墙名称的血量，不能超过5000，<BR></P>
