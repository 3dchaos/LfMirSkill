<font size="2"><span class="STYLE2"><strong>功能：</strong>登录游戏时的聊天框最上方显示公告</span><br />
<strong>和普通公告一样属于聊天框滚动公告，只是显示位置靠前<br />

------------------------------------------------<br /><br />
<p><font face="楷体" color="#ff0000" size="4"><strong>*登录游戏时的聊天框最上方显示公告</strong></font></p>
格式：脚本放入QManage.txt<br />
读取QM中[@BeforeLogin]字段<br /><br /><br /><br />


[@BeforeLogin]<br />
#ACT<br />
SENDMSG 1 在登录后“攻击模式”提示前面显示文字&lt;$USERNAME&gt;<br /><br /><br /><br /><br /><br />
