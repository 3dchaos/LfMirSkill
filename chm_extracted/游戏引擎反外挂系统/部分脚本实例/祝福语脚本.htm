<TITLE>祝福语脚本</TITLE>
</HEAD>
<BODY>
<P>[@@SendMsg]<br>
  #if<br>
  checkgold?10000<br>
  #act<br>
  take 金币 10000<br>
  SETSENDMSGFLAG<br>
  #elsesay<br>
  穷鬼，一边站着。\ \<br>
&lt;返回/@main&gt;</P>
<p>注：只能在普通NPC上发祝福语，国王系NPC将不能使用</p>
